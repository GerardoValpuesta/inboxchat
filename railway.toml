# Railway — configuración del monorepo
# Documento: https://docs.railway.app/guides/monorepo

[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @inboxchat/shared build && pnpm --filter @inboxchat/server build"

[deploy]
startCommand = "node apps/server/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
