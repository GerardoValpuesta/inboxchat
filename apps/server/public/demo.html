<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InboxChat Widget — Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .hero {
      text-align: center;
      color: white;
    }
    .hero h1 { font-size: 2.5rem; margin-bottom: 1rem; }
    .hero p { font-size: 1.1rem; opacity: 0.9; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Mi App de Prueba</h1>
    <p>El widget de chat aparece abajo a la derecha</p>
  </div>

  <!-- InboxChat Widget — pegar esto justo antes de </body> -->
  <script>
    (function(w, d, s, o) {
      w.InboxChat = w.InboxChat || {};
      w.InboxChat.workspaceKey = o.workspaceKey;
      w.InboxChat.serverUrl = o.serverUrl;

      var script = d.createElement(s);
      script.src = o.serverUrl + "/widget.js";
      script.async = true;
      script.onload = function() {
        if (typeof w.InboxChat.init === "function") {
          w.InboxChat.init(o);
        }
      };
      d.head.appendChild(script);
    })(window, document, "script", {
      workspaceKey: "dev_key_inboxchat_local",
      serverUrl: "https://inboxchatserver-production.up.railway.app",
      // Opcional: identificar al usuario logueado
      // contact: { externalId: "user_123", name: "Juan", email: "juan@email.com" }
    });
  </script>
</body>
</html>
